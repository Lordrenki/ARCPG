services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: arkpg
      POSTGRES_USER: arkpg
      POSTGRES_PASSWORD: arkpg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  postgres_data:
