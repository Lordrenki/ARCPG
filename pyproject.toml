[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arkpg"
version = "0.1.0"
description = "ARCPG Discord idle extraction RPG bot"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0",
  "SQLAlchemy>=2.0.32",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "aiomysql>=0.2.0",
  "pymysql>=1.1.1",
  "psycopg[binary]>=3.2.1",
  "redis>=5.0.8",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.2",
  "mypy>=1.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["arkpg*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
